<article class="card">{% if post.thumbnail %}<img src="{{ post.thumbnail | relative_url }}" alt="" width="600" height="315" loading="lazy" decoding="async">{% endif %}<div class="card-body">
<div class="meta">
<time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%d/%m/%Y' }}</time> · {{ post.categories | first | escape }}</div>
<h3>
<a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
</h3>
<p>{{ post.description | default: post.content | strip_html | normalize_whitespace | truncate: 155 }}</p>
</div>
</article>
